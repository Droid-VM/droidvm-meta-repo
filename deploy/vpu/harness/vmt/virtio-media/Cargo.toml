# The fork's device crate. Dependencies are `device/Cargo.toml`'s, with nix relaxed to the 0.29
# in the box's cache and v4l2r taken from the sibling package; `[features]` mirrors the fork's,
# camera-device included (added by M4).
[package]
name = "virtio-media"
version = "0.0.6"
edition = "2021"

[lib]
path = "@W@/crosvm_build/external/virtio-media/device/src/lib.rs"

[dependencies]
anyhow = "1.0.32"
enumn = "0.1.12"
libc = "0.2.151"
log = "0.4.20"
nix = { version = "0.29", features = ["fs"] }
thiserror = "1.0.38"
# 64-bit bindings: that is the layout virtio-media uses on the wire.
v4l2r = { path = "../v4l2r", features = ["arch64"] }
zerocopy = { version = "0.7.31", features = ["derive"] }

[features]
default = ["simple-device", "loopback-device", "camera-device"]
simple-device = []
loopback-device = []
camera-device = []
